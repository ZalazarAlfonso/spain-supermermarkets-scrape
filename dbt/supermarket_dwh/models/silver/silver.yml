version: 2

models:
  - name: silver_product_current
    description: "Latest valid product row per supermarket and source product."
    columns:
      - name: source_product_id
        description: "Stable source-side product identifier."
        data_tests:
          - not_null

      - name: supermarket
        description: "Supermarket source."
        data_tests:
          - not_null

      - name: product_snapshot_id
        description: "Snapshot identifier inherited from silver_product_snapshots."
        data_tests:
          - not_null

      - name: product_url
        description: "Latest known product URL."
        data_tests:
          - not_null
  - name: silver_product_snapshots
    description: "Trusted historical product snapshots across supermarkets."
    columns:
      - name: product_snapshot_id
        data_tests:
          - not_null
          - unique

      - name: source_product_id
        data_tests:
          - not_null

      - name: supermarket
        data_tests:
          - not_null
          - accepted_values:
              values: ['alcampo', 'carrefour', 'dia', 'mercadona']

      - name: scrape_date
        data_tests:
          - not_null

      - name: product_url
        data_tests:
          - not_null

      - name: product_name
        data_tests:
          - not_null

      - name: price_value
        data_tests:
          - not_null

      - name: case_type
        description: "Packaging form parsed from the product name."
        data_tests:
          - not_null
          - accepted_values:
              values: ['single', 'multipack', 'count', 'variable_weight', 'derived', 'unknown']

      - name: case_parse_status
        description: "Whether a trustworthy case quantity was parsed."
        data_tests:
          - not_null
          - accepted_values:
              values: ['parsed', 'ambiguous', 'missing']

      - name: case_validation_status
        description: "Comparison between the derived case quantity and source unit price."
        data_tests:
          - not_null

  - name: silver_product_standardized
    description: "Latest valid product rows enriched with normalized text helpers and standardized category mappings from seed-based rules."
    columns:
      - name: product_snapshot_id
        description: "Snapshot identifier inherited from silver_product_current."
        data_tests:
          - not_null

      - name: source_product_id
        description: "Stable source-side product identifier."
        data_tests:
          - not_null

      - name: supermarket
        description: "Supermarket source."
        data_tests:
          - not_null
          - accepted_values:
              values: ['alcampo', 'carrefour', 'dia', 'mercadona']

      - name: product_url
        description: "Latest known product URL."
        data_tests:
          - not_null

      - name: product_name
        description: "Raw product name inherited from silver_product_current."
        data_tests:
          - not_null

      - name: category_norm
        description: "Normalized category text used for rule matching."

      - name: subcategory_norm
        description: "Normalized subcategory text used for rule matching."

      - name: product_norm
        description: "Normalized product name used for rule matching."

      - name: group_std
        description: "Standardized top-level group assigned from the taxonomy seed."
        data_tests:
          - not_null

      - name: category_std
        description: "Standardized category assigned from the rules seed."
        data_tests:
          - not_null

      - name: subcategory_std
        description: "Standardized subcategory assigned from the rules seed."
        data_tests:
          - not_null

      - name: is_private_label
        description: "Whether the resolved brand belongs to the source supermarket."
        data_tests:
          - not_null

      - name: brand_parse_status
        description: "How completely the product brand was resolved."
        data_tests:
          - not_null
          - accepted_values:
              values: ['product_override', 'confirmed_no_brand', 'mapped', 'normalized_only', 'inferred_from_product_name', 'missing']
