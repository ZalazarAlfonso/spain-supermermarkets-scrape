version: 2

models:
  - name: fact_products_today
    description: "Products prices for today, latest date in the data."
    columns:
      - name: source_product_id
        data_tests:
          - not_null
          - unique
      - name: supermarket
        data_tests:
          - not_null
          - accepted_values:
              arguments: 
                values: ['alcampo', 'carrefour', 'dia', 'mercadona']
      - name: product_url
        data_tests:
          - not_null
      - name: product_name
        data_tests:
          - not_null
      - name: price_value
        data_tests:
          - not_null