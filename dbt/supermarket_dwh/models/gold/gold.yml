version: 2

models:
  - name: fact_products_today
    description: "Current catalogue: one row per product, each supermarket taken from its own latest complete scrape (see supermarket_freshness)."
    columns:
      - name: source_product_id
        data_tests:
          - not_null
          - unique
      - name: supermarket
        data_tests:
          - not_null
          - accepted_values:
              values: ['alcampo', 'carrefour', 'dia', 'mercadona']
      - name: product_url
        data_tests:
          - not_null
      - name: product_name
        data_tests:
          - not_null
      - name: group_std
        data_tests:
          - not_null
      - name: category_std
        data_tests:
          - not_null
      - name: subcategory_std
        data_tests:
          - not_null
      - name: price_value
        data_tests:
          - not_null
      - name: case_type
        data_tests:
          - not_null
      - name: case_parse_status
        data_tests:
          - not_null
      - name: is_private_label
        data_tests:
          - not_null
      - name: brand_parse_status
        data_tests:
          - not_null
  - name: fact_product_price_snapshots
    description: "Standardise products' price snapshots for historical analysis."
    columns:
      - name: product_snapshot_id
        data_tests:
          - not_null
          - unique
      - name: source_product_id
        data_tests:
          - not_null
      - name: supermarket
        data_tests:
          - not_null
          - accepted_values:
              values: ['alcampo', 'carrefour', 'dia', 'mercadona']
      - name: product_url
        data_tests:
          - not_null
      - name: product_name
        data_tests:
          - not_null
      - name: group_std
        data_tests:
          - not_null
      - name: category_std
        data_tests:
          - not_null
      - name: subcategory_std
        data_tests:
          - not_null
      - name: price_value
        data_tests:
          - not_null
      - name: case_type
        data_tests:
          - not_null
      - name: case_parse_status
        data_tests:
          - not_null
      - name: is_private_label
        data_tests:
          - not_null
      - name: brand_parse_status
        data_tests:
          - not_null
  - name: dim_products
    description: "Dimension table with product data."
    columns:
      - name: source_product_id
        data_tests:
          - not_null
          - unique
      - name: supermarket
        data_tests:
          - not_null
          - accepted_values:
              values: ['alcampo', 'carrefour', 'dia', 'mercadona']
      - name: product_url
        data_tests:
          - not_null
      - name: product_name
        data_tests:
          - not_null
      - name: group_std
        data_tests:
          - not_null
      - name: category_std
        data_tests:
          - not_null
      - name: subcategory_std
        data_tests:
          - not_null
      - name: case_type
        data_tests:
          - not_null
      - name: case_parse_status
        data_tests:
          - not_null
      - name: is_private_label
        data_tests:
          - not_null
      - name: brand_parse_status
        data_tests:
          - not_null

  - name: dim_taxonomy
    description: "Table with standard group, category and subcategory values."
    columns:
      - name: product_group
        data_tests:
          - not_null
      - name: category
        data_tests:
          - not_null
      - name: subcategory
        data_tests:
          - not_null

  - name: supermarket_freshness
    description: "One row per supermarket: the latest scrape, whether it was a complete catalogue, and the date fact_products_today is taken from."
    columns:
      - name: supermarket
        data_tests:
          - not_null
          - unique
          - accepted_values:
              values: ['alcampo', 'carrefour', 'dia', 'mercadona']
      - name: latest_scrape_date
        data_tests:
          - not_null
      - name: as_of_date
        description: "Latest scrape date that returned a complete catalogue; fact_products_today uses this date."
      - name: latest_volume_ratio
        description: "Latest scrape's rows over the supermarket's usual volume (90th percentile of the preceding window)."
      - name: is_stale
        description: "True when as_of_date is more than stale_after_days old at build time."
