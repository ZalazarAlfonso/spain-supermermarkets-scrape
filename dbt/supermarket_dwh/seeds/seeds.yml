version: 2

seeds:
  - name: standard_rules_v1
    description: "Rule table used to map raw product category fields into standardized category and subcategory values."
    columns:
      - name: rule_id
        description: "Identifier for a rule group. Rows with the same rule_id are combined with AND logic."
        data_tests:
          - not_null

      - name: level
        description: "Standardized output level controlled by the rule."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['category', 'subcategory','brand', 'product_name']

      - name: target
        description: "Standardized value assigned when the rule matches."
        data_tests:
          - not_null

      - name: field
        description: "Normalized product field evaluated by this rule row."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['category_norm', 'subcategory_norm', 'product_norm']

      - name: match_type
        description: "Matching strategy used against the normalized field."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['contains', 'equals', 'regex']

      - name: pattern
        description: "Literal or regex pattern to match."
        data_tests:
          - not_null

      - name: priority
        description: "Rule priority. Higher priority wins when multiple rules match."
        data_tests:
          - not_null

  - name: standard_taxonomy_v1
    description: "Authoritative standardized product taxonomy from the groups and categorization workbook."
    columns:
      - name: group_order
        description: "Display order for the top-level standardized group."
        data_tests:
          - not_null

      - name: category_order
        description: "Display order for the standardized category within its group."
        data_tests:
          - not_null

      - name: subcategory_order
        description: "Display order for the standardized subcategory within its category."
        data_tests:
          - not_null

      - name: group_std
        description: "Standardized top-level group."
        data_tests:
          - not_null

      - name: category_std
        description: "Standardized category."
        data_tests:
          - not_null

      - name: subcategory_std
        description: "Standardized subcategory."
        data_tests:
          - not_null

      - name: category_norm
        description: "Normalized standardized category label used for exact raw-label rules."
        data_tests:
          - not_null

      - name: subcategory_norm
        description: "Normalized standardized subcategory label used for exact raw-label rules."
        data_tests:
          - not_null
