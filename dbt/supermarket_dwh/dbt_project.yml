name: 'supermarket_dwh'

version: '1.0.0'

config-version: 2

profile: 'supermarket_dwh'

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  supermarket_dwh:
    +materialized: table

    staging:
      +materialized: view

    intermediate:
      +materialized: table

    silver:
      +materialized: table

    gold:
      +materialized: table
      +schema: dwh_gold_dev

seeds:
  supermarket_dwh:
    standard_rules_v1:
      +column_types:
        rule_id: int64
        level: string
        target: string
        field: string
        match_type: string
        pattern: string
        supermarket: string
        priority: int64
    standard_taxonomy_v1:
      +column_types:
        group_order: int64
        category_order: int64
        subcategory_order: int64
        group_std: string
        category_std: string
        subcategory_std: string
        category_norm: string
        subcategory_norm: string
