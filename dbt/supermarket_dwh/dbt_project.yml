name: 'supermarket_dwh'

version: '1.0.0'

config-version: 2

profile: 'supermarket_dwh'

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  supermarket_dwh:
    +materialized: table

    staging:
      +materialized: view

    intermediate:
      +materialized: table

    silver:
      +materialized: table

    gold:
      +materialized: table
      +schema: dwh_gold_dev

seeds:
  supermarket_dwh:
    standard_rules_v1:
      +column_types:
        rule_id: int64
        level: string
        target: string
        field: string
        match_type: string
        pattern: string
        supermarket: string
        priority: int64
    standard_taxonomy_v1:
      +column_types:
        group_order: int64
        category_order: int64
        subcategory_order: int64
        group_std: string
        category_std: string
        subcategory_std: string
        category_norm: string
        subcategory_norm: string
    brand_aliases_v1:
      +column_types:
        brand_alias_norm: string
        brand_std: string
        brand_group: string
        supermarket: string
        is_private_label: boolean
        priority: int64
    brand_product_overrides_v1:
      +column_types:
        source_product_id: string
        supermarket: string
        brand_std: string
        is_no_brand: boolean
        override_source: string
    brand_reviewed_products_v1:
      +column_types:
        product_snapshot_id: string
        source_product_id: string
        supermarket: string
        scrape_date: date
        product_url: string
        product_name: string
        brand_raw: string
        brand_inferred: string
        brand_inference_confidence: string
        brand_inference_method: string
        brand_previous_inferred: string
        brand_link_review_status: string
        brand_evidence: string
        brand_review_notes: string
